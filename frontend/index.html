<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
  </head>
  <body>
    <div id="app"></div>

    <div id="text-input-container" style="display: none; position: fixed; bottom: 4rem; left: 1rem; right: 1rem; z-index: 10;">
      <input
        id="text-input"
        type="text"
        placeholder="Nachricht eingeben..."
        style="width: 100%; padding: 0.5rem; box-sizing: border-box; font-size: 1rem;"
        />
    </div>

    <button
      id="mode-toggle"
      style="position: fixed; bottom: 1rem; right: 1rem; z-index: 10; padding: 0.5rem 1rem; background: #3a4a5c; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 1.2rem;"
    >
      ⌨
    </button>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
